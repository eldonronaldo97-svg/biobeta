<script>
const offers=document.querySelectorAll('.offer-card');
const selectedOffer=document.getElementById('selectedOffer');
const form=document.getElementById('orderForm');
const btn=document.getElementById('submitBtn');
const success=document.getElementById('successMsg');

offers.forEach(o=>{
  o.onclick=()=>{
    offers.forEach(x=>x.classList.remove('selected'));
    o.classList.add('selected');
    selectedOffer.value=o.dataset.offer;
  };
});

form.onsubmit=async e=>{
  e.preventDefault();
  btn.disabled=true;
  btn.textContent='جارٍ تأكيد الطلب...';

  const data=new FormData(form);

  try{ fbq('track','Purchase'); }catch(e){}

  await fetch('https://script.google.com/macros/s/AKfycbymXHAJ3wqs3EPFJEOA1L9RteYJFGPsVCoxybEb0DJbr-V8E3aGf5UCWAtb0pEz4CMl/exec',{
    method:'POST',
    body:data
  });

  btn.textContent='تم تأكيد طلبك ✓';
  success.style.display='block';
};
</script>
